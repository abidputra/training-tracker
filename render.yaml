# Render Blueprint for the Garmin service (deploys from GitHub, no CLI needed).
#
# ONE instance on purpose: a pending MFA login lives in process memory, so
# /garmin/connect and /garmin/mfa must hit the same process.
# Secrets are marked sync:false, so Render asks for them in the dashboard
# instead of reading them from this file.

services:
  - type: web
    name: training-tracker-garmin
    runtime: docker
    rootDir: garmin-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SERVICE_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
